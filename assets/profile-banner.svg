    <rect width="1200" height="300" fill="url(#grid)" opacity=".5"/>
    <path d="M0 246 C220 193 318 305 545 239 S942 195 1200 241" fill="none" stroke="#92c9ee" stroke-width="1.5" opacity=".58"/>
    <path d="M0 261 C229 207 327 323 551 258 S939 211 1200 259" fill="none" stroke="#b7dbf5" stroke-width="1.5" opacity=".75"/>
    <g fill="none" stroke="#277cba" stroke-linecap="round" stroke-linejoin="round">
