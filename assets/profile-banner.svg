      <circle cx="998" cy="150" r="75" stroke-width="1.2" stroke-dasharray="4 8" opacity=".58"/>
      <ellipse cx="998" cy="150" rx="155" ry="48" transform="rotate(-29 998 150)" stroke-width="2" opacity=".85"/>
      <ellipse cx="998" cy="150" rx="155" ry="48" transform="rotate(51 998 150)" stroke-width="1.2" opacity=".36"/>
      <path d="M932 178 996 140l64 38-64 37z M996 140v75 M932 178v-63l64-38 64 38v63 M932 115l64 39 64-39" stroke-width="1.6"/>
      <path d="M898 82l-20-18h-35m213 144 36 19h51m-273-35-21 23h-30" stroke-width="1.7" opacity=".65"/>
      <path d="m1130 65 9-9m-9 0 9 9M852 133h17m-8.5-8.5v17" stroke-width="2" opacity=".55"/>
