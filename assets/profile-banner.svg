      <rect x="65" y="185" width="72" height="4" rx="2" fill="#278cca"/>
      <text x="66" y="226" font-size="22" fill="#315b86" font-weight="400">Turning complex ideas into useful systems.</text>
      <text x="66" y="270" font-size="11" letter-spacing="3" fill="#6c95b9">BUILD  ·  LEARN  ·  ITERATE</text>
